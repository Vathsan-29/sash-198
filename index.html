<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sahana, in every language</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Noto+Serif&family=Noto+Sans+Tamil&family=Noto+Sans+Kannada&family=Noto+Sans+Telugu&family=Noto+Sans+Malayalam&family=Noto+Sans+Devanagari&family=Noto+Sans+Bengali&family=Noto+Sans+Gujarati&family=Noto+Sans+Gurmukhi&family=Noto+Sans+Sinhala&family=Noto+Sans+Arabic&family=Noto+Nastaliq+Urdu&family=Noto+Sans+Hebrew&family=Noto+Sans+Thai&family=Noto+Sans+Khmer&family=Noto+Sans+Myanmar&family=Noto+Sans+Georgian&family=Noto+Sans+Armenian&family=Noto+Sans+Ethiopic&family=Noto+Sans+Symbols+2&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="sky"></div>
<div id="hearts" aria-hidden="true"></div>

<section id="intro">
  <div class="big" id="begin" role="button" tabindex="0" aria-label="Begin">♥</div>
  <p class="lead">Sahana, in every language</p>
  <p class="sub">touch the heart to begin</p>
</section>

<main id="page" hidden>
  <header>
    <button id="fav" aria-label="Save this page">♡</button>
    <button id="snd" aria-label="Sound" aria-pressed="false">sound off</button>
  </header>
  <h1 id="lang"></h1>
  <p id="hint">touch a heart, gently</p>
  <div id="nameWrap"><div id="name" lang=""></div></div>
  <p id="meta"></p>
  <p id="line"></p>
  <nav>
    <button id="prev">Previous</button>
    <span><input id="jump" type="number" min="1" inputmode="numeric" aria-label="Go to page"><b id="count"></b></span>
    <button id="next">Next</button>
  </nav>
</main>

<section id="final" hidden>
  <div class="big pulse">♥</div>
  <p id="msg"></p>
  <button id="gridBtn">See every name</button>
  <div id="grid" hidden></div>
  <button id="back">Back to the beginning</button>
</section>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
